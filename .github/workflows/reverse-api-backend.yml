name: Knowledge Extraction
run-name: knowledge-${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL de la fuente'
        required: true
        type: string
      prompt:
        description: 'Objetivo y alcance de extracción'
        required: true
        type: string
      language:
        description: 'Lenguaje del cliente'
        type: choice
        default: python
        options: [python, typescript, javascript, go, java, csharp, php, ruby, c, powershell]
      profile:
        description: 'Perfil de conocimiento'
        type: choice
        default: general
        options: [mathematics, science, development, design, marketing, general]
      run_id:
        description: 'Identificador único: letras, números, guiones; máximo 64 caracteres'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: knowledge-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked checkout and browser
        run: |
          uv sync --locked --extra manual
          uv run --no-sync playwright install --with-deps chromium
      - name: Capture and export observed JSON
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --no-sync python -m reverse_api.knowledge_runner
      - name: Upload dataset and quality report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-${{ github.run_id }}
          path: generated/${{ inputs.run_id }}/
          if-no-files-found: error
          retention-days: 7
