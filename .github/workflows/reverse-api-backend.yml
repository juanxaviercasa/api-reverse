name: Reverse API Engine Backend

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL del sitio web a convertir en API'
        required: true
        type: string
      prompt:
        description: 'Objetivo / Datos a extraer (ej. Catálogo de problemas matemáticos, series temporales)'
        required: true
        type: string
      language:
        description: 'Lenguaje de salida'
        required: false
        default: 'python'
        type: choice
        options:
          - python
          - typescript
          - javascript
          - go
          - csharp
      run_id:
        description: 'ID de seguimiento de la ejecución'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  reverse-engineer:
    name: Run Reverse API Engineer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install reverse-api-engineer & Playwright
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install "reverse-api-engineer[manual]"
          playwright install --with-deps chromium

      - name: Prepare execution environment
        id: prep
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="run_$(date +%s)"
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_OUTPUT"
          mkdir -p "generated/$RUN_ID"

      - name: Execute Reverse API Engineer
        id: run_engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAE_OUTPUT_DIR: "generated/${{ steps.prep.outputs.RUN_ID }}"
          RAE_DEBUG: "1"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          RUN_ID="${{ steps.prep.outputs.RUN_ID }}"
          
          echo "Starting reverse engineering for ${{ inputs.url }}"
          
          # Run reverse-api-engineer in agent mode
          reverse-api-engineer agent \
            --url "${{ inputs.url }}" \
            --prompt "${{ inputs.prompt }}" \
            --no-interactive \
            --json > "generated/$RUN_ID/result.json" || true

          cat "generated/$RUN_ID/result.json"

      - name: Upload Generated Client as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-client-${{ steps.prep.outputs.RUN_ID }}
          path: generated/${{ steps.prep.outputs.RUN_ID }}/*
          retention-days: 14

      - name: Commit and push generated client
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(api): generated client for ${{ inputs.url }} [skip ci]"
            git push origin HEAD || echo "Push failed or branch protected"
          fi

      - name: Add Job Summary
        run: |
          RUN_ID="${{ steps.prep.outputs.RUN_ID }}"
          printf '### Reverse API Engineer Result\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '**Target URL:** %s\n' "${{ inputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          printf '**Prompt:** %s\n' "${{ inputs.prompt }}" >> "$GITHUB_STEP_SUMMARY"
          printf '**Language:** %s\n\n' "${{ inputs.language }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "generated/$RUN_ID/result.json" ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "generated/$RUN_ID/result.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
